name: React IDE

on:
  push:
    branches: [main, "codex/**"]
    paths:
      - "react-ide/**"
      - ".github/workflows/react-ide.yml"
  pull_request:
    paths:
      - "react-ide/**"
      - ".github/workflows/react-ide.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: react-ide
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: react-ide/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Build browser IDE
        run: npm run build
