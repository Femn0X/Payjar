name: Build Payjar (Windows + macOS)

# Runs on every push/PR to main for a quick sanity build, and produces
# downloadable release artifacts whenever you push a tag like "v1.4.0".
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

env:
  CARGO_TERM_COLOR: always

jobs:
  assembly-targets:
    name: Assembly ABI (${{ matrix.arch }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            cc: x86_64-linux-gnu-gcc
            packages: gcc
            flags: ""
            runner: ""
          - arch: x86
            cc: i686-linux-gnu-gcc
            packages: gcc-i686-linux-gnu libc6-dev-i386-cross qemu-user
            flags: ""
            runner: qemu-i386
          - arch: aarch64
            cc: aarch64-linux-gnu-gcc
            packages: gcc-aarch64-linux-gnu libc6-dev-arm64-cross qemu-user
            flags: ""
            runner: qemu-aarch64
          - arch: arm
            cc: arm-linux-gnueabihf-gcc
            packages: gcc-arm-linux-gnueabihf libc6-dev-armhf-cross qemu-user
            flags: "-march=armv7-a -mfpu=vfpv3-d16 -marm"
            runner: qemu-arm
          - arch: riscv64
            cc: riscv64-linux-gnu-gcc
            packages: gcc-riscv64-linux-gnu libc6-dev-riscv64-cross qemu-user
            flags: ""
            runner: qemu-riscv64
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install target toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y ${{ matrix.packages }}
      - name: Test emitter and execute generated assembly
        env:
          ARCH: ${{ matrix.arch }}
          CC: ${{ matrix.cc }}
          FLAGS: ${{ matrix.flags }}
          RUNNER: ${{ matrix.runner }}
        run: |
          set -euo pipefail
          rustc --edition=2024 --test tests/assembly_smoke.rs -o /tmp/asm-tests
          /tmp/asm-tests
          rustc --edition=2024 tests/assembly_smoke.rs -o /tmp/asm-emit
          cat > /tmp/asm-check.c <<'EOF'
          #include <stdint.h>
          #include <stdlib.h>
          extern int64_t payjar_entry(void);
          int main(int argc, char **argv) {
              return argc != 2 || payjar_entry() != strtoll(argv[1], 0, 10);
          }
          EOF
          for value in 0 1 -1 42 2147483648 -4294967295 9223372036854775807 -9223372036854775808; do
            /tmp/asm-emit "$ARCH" "$value" > /tmp/asm-output.s
            "$CC" $FLAGS -static /tmp/asm-check.c /tmp/asm-output.s -o /tmp/asm-check
            $RUNNER /tmp/asm-check "$value"
          done

  linux-tests:
    name: Linux compile and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install native GUI build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libxkbcommon-dev libwayland-dev libx11-dev libxcb1-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev libxkbcommon-x11-dev
      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
      - name: Compile tests
        run: cargo test --no-run
      - name: Run tests
        run: cargo test -- --nocapture

  # ---------------------------------------------------------------------
  # Windows x86_64: build and package the standard 64-bit executable.
  # ---------------------------------------------------------------------
  windows:
    name: Windows x86_64
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2

      - name: Build release executable
        run: cargo build --release

      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist/Payjar-windows-x86_64 | Out-Null
          Copy-Item target/release/Payjar.exe dist/Payjar-windows-x86_64/
          Copy-Item README.md dist/Payjar-windows-x86_64/
          Copy-Item examples dist/Payjar-windows-x86_64/ -Recurse
          Compress-Archive -Path dist/Payjar-windows-x86_64 -DestinationPath dist/Payjar-windows-x86_64.zip -Force

      - uses: actions/upload-artifact@v4
        with:
          name: Payjar-windows-x86_64
          path: dist/Payjar-windows-x86_64.zip

  # ---------------------------------------------------------------------
  # Windows ARM64: cross-compile for aarch64 Windows using the MSVC ARM64
  # target and the ARM64 libraries available on the hosted Windows image.
  # ---------------------------------------------------------------------
  windows-arm64:
    name: Windows aarch64 (ARM64)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable with Windows ARM64 target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-pc-windows-msvc

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2

      - name: Build release executable
        run: cargo build --release --target aarch64-pc-windows-msvc

      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist/Payjar-windows-aarch64 | Out-Null
          Copy-Item target/aarch64-pc-windows-msvc/release/Payjar.exe dist/Payjar-windows-aarch64/
          Copy-Item README.md dist/Payjar-windows-aarch64/
          Copy-Item examples dist/Payjar-windows-aarch64/ -Recurse
          Compress-Archive -Path dist/Payjar-windows-aarch64 -DestinationPath dist/Payjar-windows-aarch64.zip -Force

      - uses: actions/upload-artifact@v4
        with:
          name: Payjar-windows-aarch64
          path: dist/Payjar-windows-aarch64.zip

  # ---------------------------------------------------------------------
  # macOS: build Apple Silicon and Intel binaries, then combine them into
  # one universal executable.
  # ---------------------------------------------------------------------
  macos:
    name: macOS (universal)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      # Rust 1.100 regresses objc2 0.4.1 (rust-lang/rust#166229).
      - name: Install Rust 1.99.0 with both Apple targets
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.99.0
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Cache cargo registry/target
        uses: Swatinem/rust-cache@v2

      - name: Build arm64
        run: cargo build --release --target aarch64-apple-darwin

      - name: Build x86_64
        run: cargo build --release --target x86_64-apple-darwin

      - name: Merge into universal binary
        run: |
          mkdir -p dist/Payjar-macos-universal
          lipo -create \
            target/aarch64-apple-darwin/release/Payjar \
            target/x86_64-apple-darwin/release/Payjar \
            -output dist/Payjar-macos-universal/Payjar
          chmod +x dist/Payjar-macos-universal/Payjar
          cp README.md dist/Payjar-macos-universal/
          cp -R examples dist/Payjar-macos-universal/
          lipo -info dist/Payjar-macos-universal/Payjar

      - name: Ad-hoc codesign
        run: codesign --force --deep --sign - dist/Payjar-macos-universal/Payjar

      - name: Zip
        run: |
          cd dist
          zip -r Payjar-macos-universal.zip Payjar-macos-universal

      - uses: actions/upload-artifact@v4
        with:
          name: Payjar-macos-universal
          path: dist/Payjar-macos-universal.zip

  # ---------------------------------------------------------------------
  # On a v* tag, collect all three platform archives and attach them to
  # a GitHub Release.
  # ---------------------------------------------------------------------
  release:
    name: Publish GitHub Release
    needs: [windows, windows-arm64, macos, assembly-targets, linux-tests]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/Payjar-windows-x86_64/Payjar-windows-x86_64.zip
            artifacts/Payjar-windows-aarch64/Payjar-windows-aarch64.zip
            artifacts/Payjar-macos-universal/Payjar-macos-universal.zip
          generate_release_notes: true
